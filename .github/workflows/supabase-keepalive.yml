name: Supabase keep-alive

# Supabase pauses free-tier projects after ~7 days without database activity,
# which has taken the whole diyama.online backend down twice. This pings the
# database every 3 days so the project always counts as active.
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          # anon (publishable) key only; it is already public in the site's JS bundle,
          # so committing it here exposes nothing new. RLS controls all access.
          ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5zenJqZ21pY2Z5d3ByanJnY29xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxMTc1NTgsImV4cCI6MjA5OTY5MzU1OH0.XzpJeOk4By9sCsaJkEaRtFqSygAVJjAHuEkPKNJFSmY
        run: |
          curl --fail --silent --show-error \
            "https://nszrjgmicfywprjrgcoq.supabase.co/rest/v1/reviews?select=id&limit=1" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY" \
            -o /dev/null -w "HTTP %{http_code}\n"
